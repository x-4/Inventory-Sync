version: '3.8'

services:
  inventory-sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: inventory-sync-gateway:2.5.0
    container_name: inventory-sync-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Only essential: service credential UUID and optional tunnel token TOKEN
      # All network binding, memory limits, stream quotas, and paths are auto-derived
      - UUID=${UUID:-2523c510-9ff0-415b-9582-93949bfae7e3}
      - TOKEN=${TOKEN:-}
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
