version: '3.8'

services:
  inventory-sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-inventory-sync:2.4.0
    container_name: enterprise-inventory-sync
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 仅保留必需项：服务标识 UUID 与可选边缘专线接入令牌 TOKEN
      # 其余所有网络绑定、内存水位线、连接配额及路径均由运行时上下文引擎自动推导并自适应
      - UUID=${UUID:-2523c510-9ff0-415b-9582-93949bfae7e3}
      - TOKEN=${TOKEN:-}
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
