version: '3.8'

services:
  inventory-sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-inventory-sync:2.4.0
    container_name: enterprise-inventory-sync
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - UUID=${UUID:-2523c510-9ff0-415b-9582-93949bfae7e3}
      - TOKEN=${TOKEN:-}
      - STREAM_PATH=${STREAM_PATH:-/api/v2/inventory/live-stream}
      - PUBLIC_HOST=${PUBLIC_HOST:-}
      - PROFILE_TAG=${PROFILE_TAG:-ERP-Sync-Node}
      - MAX_HEAP_MB=128
      - UV_THREADPOOL_SIZE=64
      - NODE_OPTIONS=--max-old-space-size=160
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
